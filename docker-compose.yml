services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_radar
      POSTGRES_USER: ai_radar
      POSTGRES_PASSWORD: ai_radar
    ports:
      - "5432:5432"
    volumes:
      - ai_radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_radar -d ai_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_radar_postgres:
