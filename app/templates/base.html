<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AI Radar{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/htmx.min.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      {% include "partials/sidebar.html" %}
      <main class="main{% if active_nav in ['overview', 'sources', 'runs'] %} main-narrow{% endif %}">
        {% block content %}{% endblock %}
        <footer class="site-footer">
          © 2026 <a href="https://github.com/gabrieljaime" target="_blank" rel="noopener">gabrieljaime</a>
          · <a href="https://github.com/gabrieljaime/ia-radar" target="_blank" rel="noopener">AI Radar</a>
          · MIT License
        </footer>
      </main>
    </div>
  </body>
</html>
