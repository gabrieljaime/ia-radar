<aside class="sidebar">
  <div class="brand">AI <span>RADAR</span></div>
  <nav class="nav">
    <a class="nav-item {% if active_nav == 'overview' %}active{% endif %}" href="/">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1" />
        <rect x="9" y="1.5" width="5.5" height="5.5" rx="1" />
        <rect x="1.5" y="9" width="5.5" height="5.5" rx="1" />
        <rect x="9" y="9" width="5.5" height="5.5" rx="1" />
      </svg>
      Overview
    </a>
    <a class="nav-item {% if active_nav == 'radar' %}active{% endif %}" href="/radar">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <circle cx="8" cy="8" r="6.3" />
        <circle cx="8" cy="8" r="3.4" />
        <circle cx="8" cy="8" r="0.9" fill="currentColor" stroke="none" />
      </svg>
      Radar
    </a>
    <a class="nav-item {% if active_nav == 'sources' %}active{% endif %}" href="/sources">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="8" cy="3.2" rx="6" ry="1.8" />
        <path d="M2 3.2v4.4c0 1 2.7 1.8 6 1.8s6-.8 6-1.8V3.2" />
        <path d="M2 7.6v4.4c0 1 2.7 1.8 6 1.8s6-.8 6-1.8V7.6" />
      </svg>
      Sources
    </a>
    <a class="nav-item {% if active_nav == 'runs' %}active{% endif %}" href="/runs">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <line x1="2" y1="4" x2="14" y2="4" />
        <line x1="2" y1="8" x2="14" y2="8" />
        <line x1="2" y1="12" x2="9" y2="12" />
      </svg>
      Runs
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="system-state">
      <span class="state-dot {{ system_state|default('ok') }}"></span>
      {{ system_label|default('Operational') }}
    </div>
    <div class="version-line">
      v{{ app_version|default('0.1.0') }}{% if app_commit %} · {{ app_commit[:7] }}{% endif %}
    </div>
  </div>
</aside>
