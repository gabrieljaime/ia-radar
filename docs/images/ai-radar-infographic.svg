<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Radar — del ruido a las señales que importan</title>
<desc id="desc">Infografía de AI Radar: 55 fuentes públicas se recolectan, normalizan, deduplican y filtran antes de analizar eventos con un LLM; luego se puntúan por perfil y generan alertas, resumen diario y tablero web.</desc>
